name: Rust CI

on:
  push:
    branches: [main, develop]
    paths:
      - "control-plane/**"
      - "agent/**"
      - "proto/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            control-plane/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('control-plane/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: control-plane

      - name: Clippy (gateway)
        run: cargo clippy -p nebula-gateway -- -D warnings
        working-directory: control-plane

      - name: Build gateway
        run: cargo build -p nebula-gateway
        working-directory: control-plane

      - name: Test gateway
        run: cargo test -p nebula-gateway
        working-directory: control-plane
        env:
          JWT_SECRET: test-secret
          AGENT_TOKEN: test-agent-token
