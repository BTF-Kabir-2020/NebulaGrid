name: Rust CI

on:
  push:
    branches: [main, develop]
    paths:
      - "control-plane/**"
      - "agent/**"
      - "proto/**"
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nebula_test
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: nebula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            control-plane/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('control-plane/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: control-plane

      - name: Clippy
        run: cargo clippy --all -- -D warnings
        working-directory: control-plane

      - name: Build
        run: cargo build --all
        working-directory: control-plane

      - name: Test
        run: cargo test --all
        working-directory: control-plane
        env:
          DATABASE_URL: postgres://nebula:nebula_test@localhost:5432/nebula_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          AGENT_TOKEN: test-agent-token
