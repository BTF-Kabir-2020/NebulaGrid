apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nebula-gateway
  labels:
    app: nebula-grid
    component: gateway
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: nebula-gateway
                port:
                  number: {{ $.Values.gateway.service.port }}
          {{- end }}
    {{- end }}
